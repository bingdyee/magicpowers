<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Magicpowers 文档与书籍阅读站">
    <title>Magicpowers</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link rel="stylesheet" href="theme.css">
  </head>
  <body class="loading">
    <div id="reading-progress" aria-hidden="true"></div>
    <div id="app">正在加载阅读站…</div>

    <script>
      window.$docsify = {
        name: 'Magicpowers',
        nameLink: '/',
        loadNavbar: true,
        loadSidebar: true,
        alias: {
          '/.*/_navbar.md': '/_navbar.md',
          '/.*/_sidebar.md': '/_sidebar.md'
        },
        auto2top: true,
        maxLevel: 4,
        subMaxLevel: 2,
        mergeNavbar: true,
        search: {
          paths: 'auto',
          placeholder: '搜索文档与书籍',
          noData: '没有找到结果',
          depth: 4,
          namespace: 'magicpowers-docs'
        },
        pagination: {
          previousText: '上一页',
          nextText: '下一页',
          crossChapter: true,
          crossChapterText: true
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="reader.js"></script>
  </body>
</html>
